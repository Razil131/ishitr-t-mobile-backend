server:
  port: 8080

spring:
  application:
    name: backend

  kafka:
    bootstrap-servers: localhost:9092

  datasource:
    url: jdbc:postgresql://localhost:5432/tmobile_db
    username: postgres
    password: postgres_pwd
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

jwt:
  secret: ${JWT_SECRET:t-mobile-dev-secret-key-change-in-prod-32bytes-min}
  access-token-ttl: PT15M
  refresh-token-ttl: P30D
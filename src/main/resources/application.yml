server:
  port: 8080

spring:
  application:
    name: backend
  
  datasource:
    url: jdbc:postgresql://localhost:5432/tmobile_db
    username: postgres
    password: postgres_pwd
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html